<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kelvin</title>
  <meta name="description" content="An AI photo editor that edits like a person: it sets the same sliders you would, right in your browser.">
  <meta name="theme-color" content="#0E0E0F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Geist:wght@400;500&family=Geist+Mono&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Welcome: what you see first, until a photo is opened -->
  <section class="k-welcome" id="welcome">
    <svg width="88" height="88" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="k-logo-dot-big" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#5B8CFF"></stop>
          <stop offset="0.5" stop-color="#C084C8"></stop>
          <stop offset="1" stop-color="#FF7A2E"></stop>
        </linearGradient>
      </defs>
      <rect width="100" height="100" rx="23" fill="#202023"></rect>
      <g transform="translate(18 18) scale(0.64)">
        <rect x="18" y="18" width="13" height="64" rx="6.5" fill="#EDEDED"></rect>
        <path d="M80 18L52 50L80 82" fill="none" stroke="#EDEDED" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="52" cy="50" r="10" fill="url(#k-logo-dot-big)"></circle>
      </g>
    </svg>
    <h1 class="k-wordmark">kelvin</h1>
    <p class="k-caption">AI photo grading, powered by ML</p>
    <button id="welcome-open" class="k-primary">Open photo</button>
    <p class="k-small k-drop-hint">Or drop one here.</p>
  </section>

  <div id="editor" hidden>
  <header class="k-header">
    <div class="k-brand">
      <svg width="36" height="36" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="k-logo-dot" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#5B8CFF"></stop>
            <stop offset="0.5" stop-color="#C084C8"></stop>
            <stop offset="1" stop-color="#FF7A2E"></stop>
          </linearGradient>
        </defs>
        <rect width="100" height="100" rx="23" fill="#202023"></rect>
        <g transform="translate(18 18) scale(0.64)">
          <rect x="18" y="18" width="13" height="64" rx="6.5" fill="#EDEDED"></rect>
          <path d="M80 18L52 50L80 82" fill="none" stroke="#EDEDED" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="52" cy="50" r="10" fill="url(#k-logo-dot)"></circle>
        </g>
      </svg>
      <span class="k-wordmark">kelvin</span>
      <span class="k-filename" id="filename"></span>
    </div>
    <div class="k-buttons">
      <button id="auto" class="k-auto" disabled>Auto</button>
      <button id="reset" disabled>Reset all</button>
      <button id="open">Open photo</button>
      <button id="save" disabled>Save</button>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
  </header>

  <main class="k-main">
    <section class="k-sliders" id="sliders" aria-label="Sliders"></section>

    <div class="k-view">
      <div class="k-photo" id="photo">
        <div class="k-compare" id="compare" hidden>
          <canvas id="after"></canvas>
          <canvas id="before"></canvas>
          <div class="k-divider" id="divider"><span></span></div>
          <span class="k-tag k-tag-before">Before</span>
          <span class="k-tag k-tag-after">After</span>
        </div>
      </div>
      <div class="k-card k-histogram">
        <canvas id="histogram" aria-label="Histogram"></canvas>
      </div>
      <div class="k-reasons" id="reasons"></div>
    </div>
  </main>
  </div>
</body>
</html>
